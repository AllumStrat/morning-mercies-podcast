name: Refresh feed

# Rebuilds Grace's feed and cover on gh-pages when the show's config or cover art changes on main,
# so changes like the owner email or artwork reach podcast apps without waiting for the next episode.

on:
  push:
    branches: [main]
    paths: ["shows/*/config.json", "shows/*/cover.png"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-episode
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/podcast.py feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
