name: Publish episode

# The daily Claude Code task pushes a finished script to a claude/episode-DATE branch.
# This workflow turns it into audio, stores it (on gh-pages for Grace, a GitHub Release otherwise), updates the feed
# on gh-pages, deletes audio older than 60 days, and removes the staging branch.

on:
  push:
    branches: ["claude/episode-*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publish-episode
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python scripts/podcast.py publish-incoming
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.ref_name }}
      # Podcast apps need the audio served inline as MP3 (Pages sends audio/mp3) with byte ranges. Wait for Pages to
      # publish the new feed, then print what the newest episode's audio returns.
      - name: Check the newest episode's audio
        run: |
          base="https://$(echo "$GITHUB_REPOSITORY_OWNER" | tr A-Z a-z).github.io/${GITHUB_REPOSITORY#*/}"
          for show in $(ls shows); do
            url=""
            for i in $(seq 1 40); do
              url=$(curl -fsS "$base/$show/feed.xml?t=$(date +%s)" | grep -o 'enclosure url="[^"]*"' | head -1 | cut -d'"' -f2) || true
              if [[ "$url" == "$base/"* ]] && curl -fsI "$url" > /dev/null 2>&1; then break; fi
              sleep 15
            done
            echo "== $show: $url"
            curl -sSI "$url" | grep -iE '^(HTTP|content-type|content-length|accept-ranges)'
            curl -sS -o /dev/null -D - -r 0-99 "$url" | grep -iE '^(HTTP|content-type|content-range)'
            curl -sSI "$url" | grep -qiE '^content-type: audio/(mpeg|mp3)' || { echo "::error::$show audio is not served as MP3 audio"; exit 1; }
          done
